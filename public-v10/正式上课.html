.interactive-classroom .lesson-drawer p { font-size: 26px; }
.interactive-classroom .lesson-drawer-close { float: right; }
.interactive-classroom .lesson-contents { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.interactive-classroom .lesson-contents button { font-size: 24px; text-align: left; }
.interactive-classroom .lesson-movie { position: absolute; z-index: 70; inset: 0 0 78px; display: flex; align-items: center; justify-content: center; background: #07152b; }
.interactive-classroom .lesson-movie-stage { position: relative; width: min(100%, calc((100vh - 78px) * 16 / 9)); aspect-ratio: 16 / 9; overflow: clip; }
.interactive-classroom .lesson-movie video { display: block; width: 100%; height: 100%; object-fit: contain; background: #07152b; }
.interactive-classroom .lesson-movie-bar { position: absolute; left: 12px; right: 12px; top: 12px; display: flex; gap: 12px; align-items: center; justify-content: center; padding: 8px 15px; color: #daf5ff; background: #071a35d9; border-radius: 14px; font-size: 20px; transition: opacity .2s; }
.interactive-classroom .lesson-movie-stage.is-playing .lesson-movie-bar { opacity: 0; pointer-events: none; }
.interactive-classroom .lesson-movie-stage.is-playing:hover .lesson-movie-bar, .interactive-classroom .lesson-movie-stage.is-playing:focus-within .lesson-movie-bar { opacity: 1; pointer-events: auto; }
.interactive-classroom .lesson-movie-bar span { flex: 1; }
.interactive-classroom .lesson-movie-bar button { font-size: 22px; padding: 8px 14px; min-height: 42px; }
.interactive-classroom .lesson-light { position: absolute; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(ellipse at 80% 5%, #ffcf5430, transparent 40%), radial-gradient(ellipse at 20% 90%, #2aabf727, transparent 40%); animation: lesson-light-breathe 7s ease-in-out infinite alternate; }
.interactive-classroom .lesson-sparks { position: absolute; z-index: 2; pointer-events: none; inset: -3%; opacity: .7; background-image: radial-gradient(2px 2px at 5% 30%, #fff0b8 99%, transparent), radial-gradient(3px 3px at 96% 55%, #c0f5ff 99%, transparent), radial-gradient(2px 2px at 70% 13%, #fff0b8 99%, transparent), radial-gradient(2px 2px at 17% 88%, #ffdfa1 99%, transparent); animation: lesson-spark-drift 9s ease-in-out infinite alternate; }
@keyframes lesson-light-breathe { from { opacity: .5; } to { opacity: 1; } }
@keyframes lesson-spark-drift { from { transform: translateY(12px); opacity: .4; } to { transform: translateY(-14px); opacity: .9; } }
.interactive-classroom.reduced-motion *, .interactive-classroom.reduced-motion *::before, .interactive-classroom.reduced-motion *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) { .interactive-classroom *, .interactive-classroom *::before, .interactive-classroom *::after { animation: none !important; transition: none !important; } }
@media (max-width: 850px) { .interactive-classroom .lesson-navigation { gap: 5px; padding: 8px 6px; } .interactive-classroom .lesson-navigation button { padding: 8px 9px; } .interactive-classroom .lesson-drawer { left: 2%; right: 2%; padding: 18px; } .interactive-classroom .lesson-contents { grid-template-columns: 1fr; } }
